[project]
name = "void-signal-backend"
version = "1.0.0"
description = "VOID//SIGNAL — Autonomous AI News Channel Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
